version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: disease_prediction_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    volumes:
      - ../backend/disease_prediction.db:/app/backend/disease_prediction.db
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: disease_prediction_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
